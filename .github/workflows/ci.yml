# Quality gates (build-system/05, "CI Configuration"). Required on every PR to
# main; nothing merges on a failing gate.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://example.invalid
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (jsx-a11y at error)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Bundle budget (180 KB per route, gzip)
        run: npm run budget

      - name: Lighthouse CI (performance and accessibility thresholds)
        # Lighthouse only loads pages; the form is never submitted here.
        run: npx --yes @lhci/cli@0.16.0 autorun

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (forms are mandatory coverage)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (fails on high or critical in production deps)
        run: npm audit --omit=dev --audit-level=high
